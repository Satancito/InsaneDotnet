name: Publish InsaneIO.Insane to NuGet.org

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-test-pack-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      PACKAGE_PROJECT_PATH: InsaneIO.Insane/InsaneIO.Insane.csproj
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read NuGetPush flag
        id: package_settings
        shell: pwsh
        run: |
          [xml]$project = Get-Content $env:PACKAGE_PROJECT_PATH
          $nugetPush = $project.Project.PropertyGroup.NuGetPush | Select-Object -First 1

          if ([string]::IsNullOrWhiteSpace($nugetPush)) {
            $nugetPush = "false"
          }

          $nugetPush = $nugetPush.Trim().ToLowerInvariant()
          "nuget_push=$nugetPush" >> $env:GITHUB_OUTPUT

      - name: Restore package project
        run: dotnet restore ${{ env.PACKAGE_PROJECT_PATH }}

      - name: Restore test project
        run: dotnet restore InsaneIO.Insane.Tests/InsaneIO.Insane.Tests.csproj

      - name: Build tests
        run: dotnet build InsaneIO.Insane.Tests/InsaneIO.Insane.Tests.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test InsaneIO.Insane.Tests/InsaneIO.Insane.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Stop publish flow when NuGetPush is disabled
        if: steps.package_settings.outputs.nuget_push != 'true'
        shell: pwsh
        run: |
          Write-Host "NuGetPush is disabled in $env:PACKAGE_PROJECT_PATH."
          Write-Host "Skipping pack and NuGet.org publish steps."

      - name: Pack
        if: steps.package_settings.outputs.nuget_push == 'true'
        run: dotnet pack ${{ env.PACKAGE_PROJECT_PATH }} --configuration Release --no-build --output artifacts

      - name: NuGet login
        id: login
        if: steps.package_settings.outputs.nuget_push == 'true'
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_ORG_USER }}

      - name: Push packages
        if: steps.package_settings.outputs.nuget_push == 'true'
        shell: pwsh
        run: |
          $apiKey = "${{ steps.login.outputs.NUGET_API_KEY }}"
          $source = "https://api.nuget.org/v3/index.json"

          Get-ChildItem artifacts -Filter *.nupkg -File |
            Where-Object { $_.Name -notlike '*.snupkg' } |
            ForEach-Object {
              dotnet nuget push $_.FullName --api-key $apiKey --source $source --skip-duplicate
            }

          Get-ChildItem artifacts -Filter *.snupkg -File |
            ForEach-Object {
              dotnet nuget push $_.FullName --api-key $apiKey --source $source --skip-duplicate
            }
